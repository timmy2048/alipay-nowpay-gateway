services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yin
      POSTGRES_PASSWORD: yin
      POSTGRES_DB: nowpay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yin -d nowpay"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://yin:yin@db:5432/nowpay?sslmode=disable
      ADMIN_EMAIL: admin@yin.local
      ADMIN_PASSWORD: changeme-yin
      ADMIN_NAME: YIN
      ALIPAY_MODE: mock
      ALIPAY_APP_ID: ""
      ALIPAY_PRIVATE_KEY: ""
      ALIPAY_PUBLIC_KEY: ""
      ALIPAY_GATEWAY_URL: https://openapi.alipay.com/gateway.do
      WEBHOOK_SECRET: dev-webhook-secret
      PUBLIC_BASE_URL: http://127.0.0.1:43123
      ALLOWED_ORIGINS: http://127.0.0.1:43123,http://localhost:43123
      AUTO_COMMISSION: mock_book_then_settle
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18480:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "43123:80"

volumes:
  pgdata:
